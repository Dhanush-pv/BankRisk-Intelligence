# Bank universe: 15 large US bank holding companies and their main bank subsidiaries.
# FDIC data is reported by the BANK subsidiary (fdic_cert); SEC filings are made by the HOLDING
# COMPANY (sec_cik). They are different legal entities, so their figures will not match exactly.
# Identifiers were written from memory: run `python -m bankrisk.cli verify` before ingesting.
# M&T Bank's legal name in FDIC is 'Manufacturers and Traders Trust Company'.
# `expected_name_contains` is compared (case-insensitive) with the name FDIC returns for the CERT.
banks:
  - {bank_id: JPM,  short_name: JPMorgan Chase,        ticker: JPM,  fdic_cert: 628,   expected_name_contains: JPMorgan,       sec_cik: 19617}
